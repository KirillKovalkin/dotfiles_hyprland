general {
    # D-Bus lock (loginctl lock-session) → QuickShell WlSessionLock
    lock_cmd = qs ipc call lockscreen lock
    # Prefer loginctl so inhibit_sleep=3 waits for a real session-lock frame,
    # not just IPC return. Avoids racing suspend with an unlocked session.
    before_sleep_cmd = loginctl lock-session
    # Hyprland 0.57 Lua: classic `hyprctl dispatch dpms on` is parsed as Lua and fails.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; brightnessctl -r 2>/dev/null || true
    # 3 = inhibit sleep until wayland session-lock notifies "locked"
    inhibit_sleep = 3
}

listener {
    timeout = 600
    on-timeout = brightnessctl -s set 10 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; brightnessctl -r 2>/dev/null || true
}

listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
